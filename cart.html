<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodieGo - Cart</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#f8f9fb;
      padding-top:90px;
    }

    /* Navbar */
    .navbar{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      background:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 40px;
      box-shadow:0 2px 10px rgba(0,0,0,.1);
      z-index:1000;
    }

    .logo{
      font-size:24px;
      font-weight:700;
      color:#ff5722;
    }

    .nav-links{
      display:flex;
      list-style:none;
      gap:25px;
    }

    .nav-links a{
      text-decoration:none;
      color:#333;
      font-weight:600;
    }

    .nav-links a:hover{
      color:#ff5722;
    }

    .login-btn{
      background:#ff5722;
      color:white;
      padding:10px 18px;
      border-radius:6px;
      text-decoration:none;
    }

    /* Cart */
    .cart-section{
      padding:50px 8%;
    }

    .cart-section h1{
      text-align:center;
      margin-bottom:40px;
    }

    /* item */
    .cart-item{
      background:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px;
      border-radius:15px;
      margin-bottom:20px;
      box-shadow:0 5px 15px rgba(0,0,0,.08);
    }

    .cart-item img{
      width:90px;
      height:90px;
      object-fit:cover;
      border-radius:10px;
    }

    .item-info{
      flex:1;
      margin-left:20px;
    }

    .price{
      color:#ff5722;
      font-weight:600;
    }

    .quantity button{
      width:35px;
      height:35px;
      border:none;
      border-radius:50%;
      background:#ff5722;
      color:white;
      cursor:pointer;
    }

    /* summary */
    .cart-summary{
      background:white;
      padding:25px;
      border-radius:15px;
      text-align:center;
      margin-top:30px;
      box-shadow:0 5px 15px rgba(0,0,0,.08);
    }

    .checkout-btn{
      margin-top:15px;
      padding:12px 25px;
      border:none;
      background:#ff5722;
      color:white;
      border-radius:10px;
      cursor:pointer;
    }

    /* footer */
    .footer{
      background:#222;
      color:white;
      text-align:center;
      padding:20px;
      margin-top:50px;
    }

  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="logo">🍔 FoodieGo</div>

  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="menu.html">Menu</a></li>
    <li><a href="offers.html">Offers</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>

  <a href="login.html" class="login-btn">Login</a>
</nav>

<!-- CART -->
<section class="cart-section">
  <h1>🛒 Your Cart</h1>

  <div id="cartItems"></div>

  <div class="cart-summary">
    <h2>Total: ₹<span id="total">0</span></h2>
    <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  © 2026 FoodieGo. All Rights Reserved.
</footer>

<script>
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  function renderCart() {
    const container = document.getElementById("cartItems");
    container.innerHTML = "";

    let total = 0;

    cart.forEach((item, index) => {
      total += item.price * item.qty;

      const div = document.createElement("div");
      div.className = "cart-item";

      div.innerHTML = `
      <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500">

      <div class="item-info">
        <h3>${item.name}</h3>
        <p class="price">₹${item.price}</p>
      </div>

      <div class="quantity">
        <button onclick="decrease(${index})">-</button>
        <span>${item.qty}</span>
        <button onclick="increase(${index})">+</button>
      </div>
    `;

      container.appendChild(div);
    });

    document.getElementById("total").innerText = total;
  }

  function increase(i){
    cart[i].qty++;
    saveCart();
  }

  function decrease(i){
    if(cart[i].qty > 1){
      cart[i].qty--;
    } else {
      cart.splice(i,1);
    }
    saveCart();
  }

  function saveCart(){
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
  }

  function checkout(){
    alert("Order Placed Successfully 🎉");
    localStorage.removeItem("cart");
    cart = [];
    renderCart();
  }

  renderCart();
</script>

</body>
</html>
